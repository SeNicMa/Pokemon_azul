<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon NFC</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        
        // Consola objetivo: 'gba' (Game Boy Advance) o 'gbc' (Game Boy Color)
        EJS_core = 'gbc';
        
        // Apunta al archivo comprimido en tu propio repositorio para evitar pantallas negras
        EJS_gameUrl = 'Pokemon.zip';
        
        // Servidor CDN usado por repositorios públicos de GitHub Pages
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/';
        
        EJS_startOnLoaded = true;
    </script>
    
    <script src="https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/loader.js"></script>

</body>
</html>
