<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Oro GBC</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            touch-action: none;
        }
        #game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        // Configuración de EmulatorJS
        EJS_player = '#game';
        
        // Consola objetivo: 'gba' (Game Boy Advance). 
        // Cambia a 'gbc' si usas Pokémon Cristal/Amarillo o 'nds' para Nintendo DS.
        EJS_core = 'gbc';
        
        // Nombre del archivo de tu ROM subida a GitHub.
        // Asegúrate de que coincida EXACTAMENTE con el nombre de tu archivo subido.
        EJS_gameUrl = 'Pokemon_oro.gbc'; 
        
        // Servidor CDN desde donde se descarga el motor del emulador
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // Habilita guardar automáticamente
        EJS_startOnLoaded = true;
    </script>
    
    <!-- Carga del emulador externo -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
