<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon NFC</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden; touch-action: none;
        }
        #game-wrapper { width: 100%; height: 100%; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        
        // Cambia a 'gbc' para Game Boy Color o 'gba' para Game Boy Advance
        EJS_core = 'gbc'; 
        
        // Escribe aquí el nombre EXACTO de tu archivo subido a GitHub
        EJS_gameUrl = 'Pokemon_oro.gbc'; 
        
        // Usamos la versión 4.0.0 que no da error al descargar el core
        EJS_pathtodata = 'https://cdn.emulatorjs.org/v4.0.0/data/';
        EJS_startOnLoaded = true;
    </script>
    
    <script src="https://cdn.emulatorjs.org/v4.0.0/data/loader.js"></script>

</body>
</html>
