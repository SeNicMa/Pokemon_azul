<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon NFC</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="emulator-frame"></iframe>

    <script>
        // Enlace directo al reproductor estático sin dependencias rotas de CDN
        const romPath = 'Pokemon_oro.gbc'; // Cambia por el nombre exacto de tu archivo si es distinto
        
        const emulatorUrl = https://gameboy-online.github.io/?rom=${encodeURIComponent(romPath)};
        document.getElementById('emulator-frame').src = emulatorUrl;
    </script>

</body>
</html>
